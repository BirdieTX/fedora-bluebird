---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-bluebird
description: This image is a fork of Fedora Silverblue for personal use by Birdie.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        # scary
        destination: /

  - type: dnf
    repos:
      copr:
      - ublue-os/packages
      files:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      nonfree: rpmfusion
    remove:
      packages:
      - firefox
      - firefox-langpacks
      - gnome-system-monitor
      - nano-default-editor
  
  - type: dnf
    install:
      packages:
      - terra-release-mesa

  - type: dnf
    replace:
    - from-repo: terra-mesa
      packages:
      - mesa-dri-drivers
      - mesa-filesystem
      - mesa-libEGL
      - mesa-libGL
      - mesa-libgbm
      - mesa-vulkan-drivers

  - type: script
    scripts:
    - priority.sh

  - type: dnf
    install:
      packages:
      - alacritty
      - bibata-cursor-theme
      - btop
      - cmatrix
      - cargo
      - eza
      - f21-backgrounds-gnome
      - f22-backgrounds-gnome
      - f23-backgrounds-gnome
      - f24-backgrounds-gnome
      - f25-backgrounds-gnome
      - f26-backgrounds-gnome
      - f27-backgrounds-gnome
      - f28-backgrounds-gnome
      - f29-backgrounds-gnome
      - f30-backgrounds-gnome
      - f31-backgrounds-gnome
      - f32-backgrounds-gnome
      - f33-backgrounds-gnome
      - f34-backgrounds-gnome
      - f35-backgrounds-gnome
      - f36-backgrounds-gnome
      - f37-backgrounds-gnome
      - f38-backgrounds-gnome
      - f39-backgrounds-gnome
      - f40-backgrounds-gnome
      - f41-backgrounds-gnome
      - f42-backgrounds-gnome
      - f43-backgrounds-gnome
      - fastfetch
      - fzf
      - gamescope
      - gnome-rounded-blur
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-blur-my-shell
      - gnome-shell-extension-caffeine
      - gnome-shell-extension-dash-to-dock
      - gnome-shell-extension-gsconnect
      - gnome-shell-extension-just-perfection
      - google-android-emoji-fonts
      - google-arimo-fonts
      - google-droid-fonts-all
      - google-go-fonts
      - google-noto-fonts-all
      - google-noto-sans-hk-fonts
      - google-noto-serif-cjk-fonts
      - google-roboto-fonts
      - google-roboto-mono-fonts
      - google-roboto-slab-fonts
      - google-rubik-fonts
      - gstreamer1-plugins-ugly
      - jetbrains-mono-fonts-all
      - jetbrainsmono-nerd-fonts
      - kf6-kirigami-addons\
      - kvantum
      - material-icons-fonts
      - mc
      - nerd-fonts
      - papirus-icon-theme
      - plasma-breeze
      - qt5ct
      - qt6ct
      - rsms-inter-fonts
      - rsms-inter-vf-fonts
      - rust
      - setroubleshoot
      - signal-cli
      - starship
      - terminus-fonts
      - terminus-fonts-console
      - vim-default-editor
      - yazi
      - zsh
      - zsh-autocomplete
      - zsh-autosuggestions
      - zsh-html
      - zsh-syntax-highlighting

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.belmoussaoui.Decoder
        - com.brave.Browser
        - com.mattjakeman.ExtensionManager
        - com.vixalien.sticky
        - io.missioncenter.MissionCenter
        - org.gnome.baobab
        - org.gnome.Calculator
        - org.gnome.Calendar
        - org.gnome.Characters
        - org.gnome.Chess
        - org.gnome.clocks
        - org.gnome.Decibels
        - org.gnome.font-viewer
        - org.gnome.Logs
        - org.gnome.Loupe
        - org.gnome.Mahjongg
        - org.gnome.Mines
        - org.gnome.Nibbles
        - org.gnome.Papers
        - org.gnome.Showtime
        - org.gnome.SimpleScan
        - org.gnome.Snapshot
        - org.gnome.Sudoku
        - org.libreoffice.LibreOffice
        - org.gnome.Weather

  - type: gnome-extensions
    install:
      - Alphabetical App Grid
      - Desktop Icons NG (DING)
      - Keep Favorites/Pinned Apps in AppGrid
      - Logo Menu
      - Tiling Assistant
  
  - type: dnf
    remove:
      packages:
      - gnome-extensions-app

  - type: files
    files:
      - source: applications
        # scary
        destination: /

  - type: script
    scripts:
    - post.sh

  - type: initramfs
  - type: signing